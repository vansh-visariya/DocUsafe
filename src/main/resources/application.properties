spring.application.name=DocUsafe

# Server
server.port=${SERVER_PORT:8080}

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docusafe}
spring.datasource.username=${DB_USER:docusafe}
spring.datasource.password=${DB_PASSWORD:docusafe}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# File storage
app.storage.path=${DOCUSAFE_STORAGE_PATH:/data/documents}
app.storage.max-file-size=${DOCUSAFE_MAX_FILE_SIZE:10485760}
app.storage.allowed-types=${DOCUSAFE_ALLOWED_FILE_TYPES:application/pdf,image/jpeg,image/png,image/jpg}

# JWT
app.jwt.secret=${DOCUSAFE_JWT_SECRET:change-this-secret-to-a-strong-value-please}
app.jwt.expiration-ms=${DOCUSAFE_JWT_EXPIRATION_MS:86400000}

# Multipart uploads
spring.servlet.multipart.max-file-size=${DOCUSAFE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUSAFE_MAX_FILE_SIZE:10MB}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
